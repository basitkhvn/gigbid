# Render blueprint: one Docker web service. Set secrets in the Render dashboard (never in git):
#   GROQ_API_KEY (free tier, open-weight Qwen; or switch MODEL_PROFILE to open + DEEPSEEK_API_KEY), APP_SECRET_KEY, REVIEWER_PASSWORD (and optionally REVIEWER_EMAIL / REVIEWER_PERSONA)
services:
  - type: web
    name: gigbid
    runtime: docker
    dockerfilePath: infra/docker/single.Dockerfile
    healthCheckPath: /health
    plan: free               # 512 MB RAM: measured ~300 MB peak for retrieval alone; sleeps after 15 min idle (first request is slow)
    envVars:
      - {key: MODEL_PROFILE, value: groq}
      - {key: GIGBID_STATE_DIR, value: /tmp/state}   # free plan has no persistent disk: state resets on restart
      - {key: GIGSIM_INPROCESS, value: "1"}
      - {key: GROQ_API_KEY, sync: false}
      - {key: APP_SECRET_KEY, generateValue: true}
      - {key: REVIEWER_PASSWORD, sync: false}
