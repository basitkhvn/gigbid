name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11 && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: PYTHONPATH=. .venv/bin/python scripts/check_repo_rules.py
      - run: PYTHONPATH=. .venv/bin/pytest          # unit + MCP + contract (schema snapshots) + integration, offline profile
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11 && uv pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cd apps/web && npm ci && npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: apps/web/playwright-report}
